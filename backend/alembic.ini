# Alembic owns the API-owned `app` schema only. The pipeline-owned raw/clean/graph/
# findings tables are deliberately outside its control — see alembic/env.py.
[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
path_separator = os
# sqlalchemy.url is intentionally absent: env.py reads it from Settings so there is one
# source of truth for the database path and it never gets committed to a config file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
